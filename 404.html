<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 | Rikdom Chile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --navy:#123b57;
      --navy-dark:#0b2637;
      --red:#bf1836;
      --red-dark:#9f142d;
      --white:#ffffff;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family:Inter,Arial,sans-serif;
      background:var(--navy-dark);
      color:#fff;
    }

    body{
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    .navbar{
      height:78px;
      background:#fff;
      display:flex;
      align-items:center;
      border-bottom:1px solid rgba(18,59,87,.08);
    }

    .nav-inner{
      width:min(calc(100% - 40px),1320px);
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
    }

    .brand img{
      width:118px;
      height:46px;
      object-fit:contain;
      display:block;
    }

    .home-link{
      text-decoration:none;
      color:var(--navy);
      font-size:14px;
      font-weight:700;
    }

    .page{
      flex:1;
      position:relative;
      display:grid;
      place-items:center;
      overflow:hidden;
      padding:70px 20px;
      background:
        linear-gradient(90deg,rgba(4,18,25,.90),rgba(4,18,25,.72)),
        url('assets/hero-rikdom.jpg') center/cover no-repeat;
    }

    .page::before{
      content:"404";
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      font-size:min(38vw,520px);
      line-height:.8;
      font-weight:800;
      letter-spacing:-.08em;
      color:rgba(255,255,255,.045);
      pointer-events:none;
      user-select:none;
      white-space:nowrap;
    }

    .content{
      position:relative;
      z-index:2;
      max-width:760px;
      text-align:center;
    }

    .eyebrow{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:12px;
      margin-bottom:22px;
      color:#fff;
      font-size:12px;
      font-weight:800;
      letter-spacing:.16em;
      text-transform:uppercase;
    }

    .eyebrow::before,
    .eyebrow::after{
      content:"";
      width:34px;
      height:2px;
      background:var(--red);
    }

    h1{
      margin:0;
      font-size:clamp(52px,8vw,104px);
      line-height:.92;
      letter-spacing:-.055em;
    }

    p{
      max-width:610px;
      margin:25px auto 0;
      font-size:17px;
      line-height:1.7;
      color:rgba(255,255,255,.78);
    }

    .actions{
      margin-top:34px;
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .btn{
      min-height:50px;
      padding:0 20px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      text-decoration:none;
      font-size:14px;
      font-weight:700;
      border-radius:3px;
      transition:.2s ease;
    }

    .btn-primary{
      background:var(--red);
      color:#fff;
    }

    .btn-primary:hover{
      background:var(--red-dark);
      transform:translateY(-1px);
    }

    .btn-secondary{
      border:1px solid rgba(255,255,255,.6);
      color:#fff;
    }

    .btn-secondary:hover{
      background:#fff;
      color:var(--navy);
    }

    .footer{
      background:var(--navy-dark);
      color:rgba(255,255,255,.45);
      text-align:center;
      padding:18px 20px;
      font-size:11px;
    }

    @media(max-width:620px){
      .navbar{height:68px}
      .brand img{width:103px;height:40px}
      .home-link{font-size:13px}
      .page{padding:55px 16px}
      p{font-size:15px}
    }
  </style>
</head>

<body>
  <header class="navbar">
    <div class="nav-inner">
      <a class="brand" href="/">
        <img src="assets/logo-rikdom.png" alt="Rikdom Chile">
      </a>
      <a class="home-link" href="/">Volver al inicio →</a>
    </div>
  </header>

  <main class="page">
    <div class="content">
      <div class="eyebrow">Error 404</div>
      <h1>Esta página no existe.</h1>
      <p>
        El contenido que buscas pudo haber cambiado de ubicación o ya no estar disponible.
        Puedes volver al inicio o escribirnos directamente.
      </p>

      <div class="actions">
        <a class="btn btn-primary" href="/">Volver al inicio →</a>
        <a class="btn btn-secondary" href="mailto:operaciones@rikdomchile.com">
          operaciones@rikdomchile.com
        </a>
      </div>
    </div>
  </main>

  <footer class="footer">
    © 2026 Rikdom Chile SpA.
  </footer>
</body>
</html>
